#
# On tag creation (vX.Y.Z), build the multi-arch image and publish it to
# Docker Hub at ditdotdev/zfs-builder:<tag> and :latest. Then create a
# GitHub release with auto-generated notes.
#
name: Release

on: create

jobs:
  publish:
    name: Build and publish Docker image
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Extract tag name
        id: extract_tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ditdotdev/zfs-builder:${{ steps.extract_tag.outputs.TAG_NAME }}
            ditdotdev/zfs-builder:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          generate_release_notes: true
          name: ${{ steps.extract_tag.outputs.TAG_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
