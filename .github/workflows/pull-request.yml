name: Pull Request

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install BATS
        run: npm install -g bats

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Shellcheck
        run: |
          cd src
          shellcheck -x build.sh
          shellcheck wsl.sh

      - name: Run BATS tests
        run: |
          bats src/tests/test_build.bats
          bats src/tests/test_wsl.bats

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: datadatdat/zfs-builder:test
